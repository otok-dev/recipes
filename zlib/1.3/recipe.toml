# The otok recipe of zlib (https://github.com/apotocki/otok): libz for the native target, from the release
# archive; static or dynamic.
[recipe]
api = 1
library = "zlib"
name = "zlib"
version = "1.3.2"
revision = 1
license = "Zlib"
license-files = ["LICENSE"]
homepage = "https://zlib.net"
description = "zlib, the general-purpose compression library."
keywords = ["compression", "deflate", "zlib"]
linkage = ["static", "dynamic"]

[source]
url = "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"

[platforms]
supported = ["native"]

[toolchains]
cmake = ">= 3.20"
ninja = ">= 1.10"

[[product]]
name = "ZLIB"
libraries = ["z"]
