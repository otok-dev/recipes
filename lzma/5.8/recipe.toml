# The otok recipe of liblzma from XZ Utils (https://github.com/apotocki/otok): the library alone for
# Android and every Apple platform, from the release tag; static or dynamic on Android and the native target.
[recipe]
api = 1
library = "lzma"
name = "lzma"
version = "5.8.4"
revision = 2
license = "0BSD"
# COPYING tells which license applies to which part; liblzma is 0BSD
license-files = ["COPYING", "COPYING.0BSD"]
homepage = "https://tukaani.org/xz/"
description = "liblzma, the LZMA and XZ compression library of XZ Utils."
keywords = ["compression", "lzma", "xz"]
linkage = ["static", "dynamic"]

[source]
git = "https://github.com/tukaani-project/xz"
commit = "d3e650e63c110e830fd5391e7f8b45df0b91d3da"
tag = "v5.8.4"

[platforms]
supported = ["android", "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim", "native"]

[toolchains]
cmake = ">= 3.20"
ninja = ">= 1.10"

[[product]]
name = "LZMA"
libraries = ["lzma"]
apple = { privacy-manifest = "PrivacyInfo.xcprivacy" }
