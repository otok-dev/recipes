# The otok recipe of libssh2 (https://github.com/apotocki/otok): the SSH2 client library for every
# Apple platform, from the release archive, with OpenSSL as its crypto backend and the system zlib.
[recipe]
api = 1
library = "libssh2"
name = "libssh2"
version = "1.11.1"
revision = 1
license = "BSD-3-Clause"
license-files = ["COPYING"]
homepage = "https://libssh2.org"
description = "libssh2, a client-side C library implementing the SSH2 protocol."
keywords = ["ssh", "sftp"]

[source]
# the release archive: the git tag says "1.11.1_DEV" in libssh2.h
url = "https://libssh2.org/download/libssh2-1.11.1.tar.gz"
sha256 = "d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7"

[platforms]
supported = ["ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim"]

[dependencies.openssl]
version = ">= 3.0"
default-recipe = "apotocki/openssl"

[toolchains]
cmake = ">= 3.20"
ninja = ">= 1.10"

[[product]]
name = "LibSSH2"
libraries = ["ssh2"]
link = { libraries = ["z"] }
apple = { privacy-manifest = "PrivacyInfo.xcprivacy" }
