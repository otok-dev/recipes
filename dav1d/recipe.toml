# The otok recipe of dav1d (https://github.com/apotocki/otok): VideoLAN's AV1 decoder, built with
# meson (otok.meson), for every Apple platform and the native target.
[recipe]
api = 1
library = "dav1d"
name = "dav1d"
version = "1.5.4"
revision = 1
license = "BSD-2-Clause"
license-files = ["COPYING"]
homepage = "https://code.videolan.org/videolan/dav1d"
description = "dav1d, an AV1 decoder focused on speed and correctness."
keywords = ["av1", "video", "decoder"]
linkage = ["static", "dynamic"]

[source]
url = "https://downloads.videolan.org/pub/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz"
sha256 = "686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5"

[platforms]
supported = ["ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim", "native"]

[toolchains]
meson = ">= 1.2"
ninja = ">= 1.10"
nasm = ">= 2.14"  # the assembly of x86_64

[[product]]
name = "Dav1d"
libraries = ["dav1d"]
apple = { privacy-manifest = "none" }
