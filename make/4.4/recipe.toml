# The otok recipe of GNU Make (https://github.com/apotocki/otok): the make program for the builds of other recipes, which
# name it as their toolchain (`make = { default-recipe = "apotocki/make" }`). On Windows the make of MSYS2 with the
# programs its rules and configure scripts run (bash as sh, coreutils, sed, grep, gawk, diffutils, findutils), one MSYS2
# tree of pinned packages, as vcpkg brings it; otok.autotools runs configure through the sh beside make. Elsewhere
# built from the source archive by its build.sh, so it needs no make: a make with the jobserver of make 4.4 on macOS
# too, whose own is 3.81.
[recipe]
api = 1
library = "make"
name = "make"
version = "4.4.1"
revision = 1
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
homepage = "https://www.gnu.org/software/make/"
description = "GNU Make: MSYS2's with the shell and tools of its rules on Windows, built from source elsewhere."
keywords = ["build", "tool"]

[tool]
programs = ["make"]

[source]
url = "https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz"
sha256 = "dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3"
mirrors = ["https://ftpmirror.gnu.org/gnu/make/make-4.4.1.tar.gz"]

[platforms]
supported = ["native"]

# Written by tools/msys2-packages.py of this repository from the packages named on the next line and what they need.
# BEGIN MSYS2 packages: make bash coreutils sed grep gawk diffutils findutils
# bash 5.3.20-2, coreutils 8.32-5, diffutils 3.12-1, findutils 4.11.0-2, gawk 5.4.1-1, gcc-libs 16.2.0-1, gmp 6.3.0-2,
# grep 1~3.0-7, libiconv 1.19-1, libintl 0.22.5-1, libpcre 8.45-5, libreadline 8.3.006-1, make 4.4.1-3, mpfr 4.2.2-1,
# msys2-runtime 3.6.11-4, ncurses 6.6-2, sed 4.9-1

