# The otok recipe of Skia (https://github.com/apotocki/otok): the 2D graphics library for Windows, built with GN and
# clang-cl, as skia.dll or skia.lib. The source is the branch otok/152 of apotocki/skia: Skia's main at 9f737d3a
# (milestone 152) with the fixes of skia-dev, a commit each (leaks freed by SkGraphics::PurgeLeakedByDesignCaches(),
# the Direct3D backend). The libraries of third_party/externals are resources at the commits of that revision's DEPS.
[recipe]
api = 1
library = "skia"
name = "skia"
version = "152.0.0"
revision = 1
license = "BSD-3-Clause"
license-files = ["LICENSE"]
homepage = "https://skia.org"
description = "Skia, the 2D graphics library of Chrome and Android: the core with the Direct3D backend and the codecs."
keywords = ["graphics", "2d", "gpu"]
linkage = ["static", "dynamic"]

[source]
git = "https://github.com/apotocki/skia"
commit = "2e21637acd9980078d3d2e03eead5baeec4e082a"

[platforms]
supported = ["native"]

[toolchains]
# Skia's own GN (bin/fetch-gn) and the python of its scripts (exec_script)
gn = { version = ">= 2175", default-recipe = "apotocki/gn" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }
python = { version = ">= 3.8", default-recipe = "apotocki/python" }
# Skia's GN builds Windows with clang-cl and lld-link of an LLVM directory (clang_win), MSVC's headers and libraries
clang-cl = ">= 20"

[[product]]
name = "Skia"
libraries = ["skia"]

[[resource]]
name = "zlib"
git = "https://chromium.googlesource.com/chromium/src/third_party/zlib"
commit = "646b7f569718921d7d4b5b8e22572ff6c76f2596"
dest = "third_party/externals/zlib"

[[resource]]
name = "libpng"
git = "https://skia.googlesource.com/third_party/libpng.git"
commit = "d5515b5b8be3901aac04e5bd8bd5c89f287bcd33"
dest = "third_party/externals/libpng"

[[resource]]
name = "libjpeg_turbo"
git = "https://chromium.googlesource.com/chromium/deps/libjpeg_turbo.git"
commit = "e14cbfaa85529d47f9f55b0f104a579c1061f9ad"
dest = "third_party/externals/libjpeg-turbo"

[[resource]]
name = "libwebp"
git = "https://chromium.googlesource.com/webm/libwebp.git"
commit = "845d5476a866141ba35ac133f856fa62f0b7445f"
dest = "third_party/externals/libwebp"

[[resource]]
name = "wuffs"
git = "https://skia.googlesource.com/external/github.com/google/wuffs-mirror-release-c.git"
commit = "e3f919ccfe3ef542cfc983a82146070258fb57f8"
dest = "third_party/externals/wuffs"

[[resource]]
name = "expat"
git = "https://chromium.googlesource.com/external/github.com/libexpat/libexpat.git"
commit = "6154446fccefbf3ca644894f598969113b0c7bcd"
dest = "third_party/externals/expat"

[[resource]]
name = "harfbuzz"
git = "https://chromium.googlesource.com/external/github.com/harfbuzz/harfbuzz.git"
commit = "9cb1fee51069b206effb4736e443b038d230789d"
dest = "third_party/externals/harfbuzz"

[[resource]]
name = "spirv_cross"
git = "https://chromium.googlesource.com/external/github.com/KhronosGroup/SPIRV-Cross"
commit = "b8fcf307f1f347089e3c46eb4451d27f32ebc8d3"
dest = "third_party/externals/spirv-cross"

[[resource]]
name = "d3d12allocator"
git = "https://skia.googlesource.com/external/github.com/GPUOpen-LibrariesAndSDKs/D3D12MemoryAllocator.git"
commit = "169895d529dfce00390a20e69c2f516066fe7a3b"
dest = "third_party/externals/d3d12allocator"
