# The otok recipe of Pixman (https://github.com/apotocki/otok): libpixman-1 for the native target, from the release
# tag; static or dynamic. pixman_reset_static_data() frees the implementations it chose for the CPU, which MSVC's
# builds never free (Cairo's cairo_debug_reset_static_data() calls it).
[recipe]
api = 1
library = "pixman"
name = "pixman"
version = "0.44.2"
revision = 1
license = "MIT"
license-files = ["COPYING"]
homepage = "https://pixman.org"
description = "Pixman, the pixel-manipulation library of Cairo and X."
keywords = ["graphics", "pixels", "compositing"]
linkage = ["static", "dynamic"]

[source]
git = "https://gitlab.freedesktop.org/pixman/pixman.git"
commit = "46655e15671e1ca62d699821d75a85d341d7229c"
tag = "pixman-0.44.2"
patches = ["patches/0001-reset-static-data.patch"]

[platforms]
supported = ["native"]

[toolchains]
meson = ">= 1.3"
ninja = ">= 1.10"

[[product]]
name = "Pixman"
libraries = ["pixman-1"]
