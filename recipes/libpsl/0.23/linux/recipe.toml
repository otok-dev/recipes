# The otok recipe of libpsl (https://github.com/apotocki/otok): libpsl, the Public Suffix List library, for Linux, from the
# release archive, with libpsl's meson build and its built-in copy of the list (the snapshot the release carries, made into
# a table by Python while building); no IDNA library at run time, so domains are taken as ASCII or punycode; static or dynamic.
[recipe]
api = 1
library = "libpsl"
name = "libpsl"
version = "0.23.3"
revision = 1
license = "MIT"
license-files = ["COPYING"]
homepage = "https://rockdaboot.github.io/libpsl/"
documentation = "https://rockdaboot.github.io/libpsl/libpsl-docs/"
description = "libpsl, a C library to handle the Public Suffix List."
keywords = ["publicsuffix", "cookies", "domain"]
linkage = ["static", "dynamic"]

[source]
url = "https://github.com/rockdaboot/libpsl/releases/download/0.23.3/libpsl-0.23.3.tar.gz"
sha256 = "93941f85a1e7bd593fa94f299233cb5dfc91cd144fd9a78a6ceb75001c5b03be"

[platforms]
supported = ["linux"]
build-on = ["linux/gcc", "linux/clang"]

[toolchains]
meson = { version = ">= 1.3", default-recipe = "apotocki/meson" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "PSL"
libraries = ["psl"]

