## Configure targets of the otok recipe: one per ABI of the Android target. otok's toolchain brings the compiler and its
## flags (CC with --target and --sysroot, CFLAGS with the API level), so these targets carry no NDK probing, unlike the
## android targets of 15-android.conf, which look for the NDK in ANDROID_NDK_ROOT.

my %targets = (
    "otok-android" => {
        inherit_from     => [ "linux-generic32" ],
        template         => 1,
        bin_cflags       => "-fPIE",
        bin_lflags       => "-pie",
        enable           => [ ],
        shared_extension => ".so",
    },
    # as android-arm, without RC4_CHAR (a speed choice that changes RC4_KEY: the Android target keeps one include/ for its ABIs)
    "otok-android-armeabi-v7a" => {
        inherit_from     => [ "otok-android" ],
        bn_ops           => "BN_LLONG",
        asm_arch         => 'armv4',
        perlasm_scheme   => "void",
    },
    # as android-arm64, with the pages of 16 KiB Android 15 devices may have
    "otok-android-arm64-v8a" => {
        inherit_from     => [ "otok-android" ],
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "linux64",
        shared_ldflag    => add("-Wl,-z,max-page-size=16384"),
    },
    # as android-x86
    "otok-android-x86" => {
        inherit_from     => [ "otok-android" ],
        CFLAGS           => add(picker(release => "-fomit-frame-pointer")),
        bn_ops           => "BN_LLONG",
        asm_arch         => 'x86',
        perlasm_scheme   => "android",
        ex_libs          => add(threads("-latomic")),
    },
    # as android-x86_64
    "otok-android-x86_64" => {
        inherit_from     => [ "otok-android" ],
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'x86_64',
        perlasm_scheme   => "elf",
        shared_ldflag    => add("-Wl,-z,max-page-size=16384"),
    },
);
