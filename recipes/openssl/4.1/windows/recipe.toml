# The otok recipe of OpenSSL (https://github.com/apotocki/otok): libssl and libcrypto for Windows, from the release
# tag: with MSVC and nmake on Windows, the perl of its recipe (a native one, which the VC- targets need) and NASM for
# the x86_64 assembler; or with clang-cl and GNU make across from Linux.
[recipe]
api = 1
library = "openssl"
name = "openssl"
version = "4.1.0"
revision = 1
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
homepage = "https://www.openssl.org"
description = "OpenSSL (libssl, libcrypto), built from source."
keywords = ["tls", "crypto"]
linkage = ["static", "dynamic"]

[source]
git = "https://github.com/openssl/openssl"
commit = "2f4e3a5fec05394068cfa7379890ab552483a8a6"
tag = "openssl-4.1.0"

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[options.no-deprecated]
type = "bool"
default = false
doc = "Configure with no-deprecated: removes the deprecated APIs."

[[product]]
name = "OpenSSL"
libraries = ["ssl", "crypto"]
headers = "crypto"
# what a static libcrypto calls (Configure's ex_libs of the VC- targets)
link = { libraries = ["ws2_32", "crypt32", "advapi32", "user32", "gdi32"] }
defines = [{ define = "OPENSSL_NO_DEPRECATED", when = { option = "no-deprecated" } }]

[toolchains]
perl = { version = ">= 5.30", default-recipe = "apotocki/perl" }
nasm = { version = ">= 2.09", default-recipe = "apotocki/nasm", when = { arch = ["x86_64"], environment = ["windows/msvc"] } }
make = { version = ">= 3.81", default-recipe = "apotocki/make", when = { environment = ["linux/clang-cl"] } }
