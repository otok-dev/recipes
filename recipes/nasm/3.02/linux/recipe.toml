# The otok recipe of NASM (https://github.com/apotocki/otok): the nasm assembler for the builds of other recipes, which
# name it as their toolchain (`nasm = { default-recipe = "apotocki/nasm" }`), on Linux: built from the release archive
# with its configure and make.
[recipe]
api = 1
library = "nasm"
name = "nasm"
version = "3.02"
revision = 1
license = "BSD-2-Clause"
license-files = ["LICENSE"]
homepage = "https://www.nasm.us"
description = "NASM, the Netwide Assembler, built from source."
keywords = ["assembler", "tool"]

[tool]
programs = ["nasm"]

[source]
url = "https://www.nasm.us/pub/nasm/releasebuilds/3.02/nasm-3.02.tar.xz"
sha256 = "87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d"

[platforms]
supported = ["linux"]
build-on = ["linux/gcc", "linux/clang"]

[toolchains]
make = { version = ">= 3.81", default-recipe = "apotocki/make" }
