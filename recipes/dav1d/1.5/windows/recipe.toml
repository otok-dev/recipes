# The otok recipe of dav1d (https://github.com/apotocki/otok): VideoLAN's AV1 decoder, built with meson
# (otok.meson), for Windows, with MSVC or with clang-cl across from Linux; static or dynamic.
[recipe]
api = 1
library = "dav1d"
name = "dav1d"
version = "1.5.4"
revision = 1
license = "BSD-2-Clause"
license-files = ["COPYING"]
homepage = "https://code.videolan.org/videolan/dav1d"
description = "dav1d, an AV1 decoder focused on speed and correctness."
keywords = ["av1", "video", "decoder"]
linkage = ["static", "dynamic"]

[source]
url = "https://downloads.videolan.org/pub/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz"
sha256 = "686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5"

# FFmpeg's gas-preprocessor, through which dav1d's meson.build assembles its arm64 assembler with MSVC's armasm64
[[resource]]
name = "gas_preprocessor"
url = "https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/ac1836309c2e77023c228b7184485597286289d3/gas-preprocessor.pl"
sha256 = "7124d70cdecba7c5612f9a71fbf3f28514dd9c2ca3022f58ad793f88bb925fcf"
unpack = false
when = { arch = ["arm64"], environment = ["windows/msvc"] }

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[toolchains]
meson = { version = ">= 1.2", default-recipe = "apotocki/meson" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }
nasm = { version = ">= 2.14", default-recipe = "apotocki/nasm", when = { arch = ["x86_64"] } }  # the assembly of x86_64
perl = { version = ">= 5.30", default-recipe = "apotocki/perl", when = { arch = ["arm64"], environment = ["windows/msvc"] } }  # gas-preprocessor's

[[product]]
name = "Dav1d"
libraries = ["dav1d"]
