# The otok recipe of dav1d (https://github.com/otok-dev/otok): VideoLAN's AV1 decoder, built with meson
# (otok.meson), for Android; static or dynamic.
[recipe]
api = 1
library = "dav1d"
name = "dav1d"
version = "1.5.5"
revision = 1
license = "BSD-2-Clause"
license-files = ["COPYING"]
homepage = "https://code.videolan.org/videolan/dav1d"
description = "dav1d, an AV1 decoder focused on speed and correctness."
keywords = ["av1", "video", "decoder"]
linkage = ["static", "dynamic"]

[source]
url = "https://downloads.videolan.org/pub/videolan/dav1d/1.5.5/dav1d-1.5.5.tar.xz"
sha256 = "ca96b1d0ba3f01f55de7231d775892b64994ba061aaeeaaa4f662a390b3abf9e"

[platforms]
supported = ["android"]
build-on = ["*/ndk"]

[toolchains]
meson = { version = ">= 1.2", default-recipe = "apotocki/meson" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }
nasm = { version = ">= 2.14", default-recipe = "apotocki/nasm", when = { arch = ["x86_64", "x86"] } }  # the assembly of x86

[[product]]
name = "Dav1d"
libraries = ["dav1d"]
