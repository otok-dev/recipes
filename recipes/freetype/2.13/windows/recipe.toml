# The otok recipe of FreeType (https://github.com/apotocki/otok): freetype for Windows, from the release tag, with
# MSVC or with clang-cl across from Linux, without its optional dependencies (zlib of its own, no bzip2, libpng,
# HarfBuzz or Brotli); static or dynamic.
[recipe]
api = 1
library = "freetype"
name = "freetype"
version = "2.13.3"
revision = 1
license = "FTL OR GPL-2.0-or-later"
license-files = ["LICENSE.TXT", "docs/FTL.TXT", "docs/GPLv2.TXT"]
homepage = "https://freetype.org"
description = "FreeType, the font rasterizer."
keywords = ["font", "truetype", "rasterizer"]
linkage = ["static", "dynamic"]

[source]
git = "https://gitlab.freedesktop.org/freetype/freetype.git"
commit = "42608f77f20749dd6ddc9e0536788eaad70ea4b5"
tag = "VER-2-13-3"
patches = ["patches/0001-t42-activate-created-size.patch"]

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "FreeType"
libraries = ["freetype"]
