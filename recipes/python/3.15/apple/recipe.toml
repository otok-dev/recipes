# The otok recipe of Python (https://github.com/otok-dev/otok): the python program for the build scripts of other
# recipes, which name it as their toolchain (`python = { default-recipe = "apotocki/python" }`), on macOS: the
# install_only build of python-build-standalone of the build machine (a resource per architecture, fetched on that
# machine only). It has no pip packages: the standard library only. The source archive carries the license.
[recipe]
api = 1
library = "python"
name = "python"
version = "3.15.2"
revision = 1
license = "PSF-2.0"
license-files = ["LICENSE"]
homepage = "https://www.python.org"
description = "Python, the interpreter, prebuilt for the build machine."
keywords = ["python", "interpreter", "tool"]

[tool]
programs = ["python"]

[source]
url = "https://www.python.org/ftp/python/3.15.2/Python-3.15.2.tar.xz"
sha256 = "8b5536d280142ecf6cdfe15d12a21ba1c65e300bbf7b28a8d0cdb849575797de"

[[resource]]
name = "macos_arm64"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.15.2%2B20261026-aarch64-apple-darwin-install_only.tar.gz"
sha256 = "285a6b924713bec9c1cdf442ba5ebfbafbab070060b34d607c30546b758e64a6"
when = { host = ["macos-arm64"] }

[[resource]]
name = "macos_x86_64"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.15.2%2B20261026-x86_64-apple-darwin-install_only.tar.gz"
sha256 = "c09fb50147ca9743a6d21e765d6243d8a21da04aed2d83b74f5a5c164d8d85bc"
when = { host = ["macos-x86_64"] }

[platforms]
supported = ["macosx"]
build-on = ["macos/xcode"]
