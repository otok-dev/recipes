# The otok recipe of Python (https://github.com/otok-dev/otok): the python program for the build scripts of other
# recipes, which name it as their toolchain (`python = { default-recipe = "apotocki/python" }`), on Windows: the
# embeddable package of python.org of the build machine (a resource per architecture, fetched on that machine only),
# laid out as an installation (Lib/, no ._pth). It has no pip packages: the standard library only. The source archive
# carries the license.
[recipe]
api = 1
library = "python"
name = "python"
version = "3.15.2"
revision = 1
license = "PSF-2.0"
license-files = ["LICENSE"]
homepage = "https://www.python.org"
description = "Python, the interpreter, prebuilt for the build machine: python.org's embeddable package on Windows."
keywords = ["python", "interpreter", "tool"]

[tool]
programs = ["python"]

[source]
url = "https://www.python.org/ftp/python/3.15.2/Python-3.15.2.tar.xz"
sha256 = "8b5536d280142ecf6cdfe15d12a21ba1c65e300bbf7b28a8d0cdb849575797de"

[[resource]]
name = "windows_x86_64"
url = "https://www.python.org/ftp/python/3.15.2/python-3.15.2-embed-amd64.zip"
sha256 = "d012f3aa29cf07436dae8aea1fec0fd195c2612a0b059b1f915ae0afb9ad1f62"
when = { host = ["windows-x86_64"] }

[[resource]]
name = "windows_arm64"
url = "https://www.python.org/ftp/python/3.15.2/python-3.15.2-embed-arm64.zip"
sha256 = "089eae5e8aba8284c2ce59df008c1dc915af46fd9e8b1227e3a7f315211567c9"
when = { host = ["windows-arm64"] }

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "windows/clang-cl"]
