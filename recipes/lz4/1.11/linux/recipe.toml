# The otok recipe of LZ4 (https://github.com/apotocki/otok): liblz4 for Linux, from the release tag; static or
# dynamic.
[recipe]
api = 1
library = "lz4"
name = "lz4"
version = "1.11.1"
revision = 1
license = "BSD-2-Clause"
license-files = ["lib/LICENSE"]
homepage = "https://lz4.org"
description = "LZ4, an extremely fast lossless compression library."
keywords = ["compression", "lz4"]
linkage = ["static", "dynamic"]

[source]
git = "https://github.com/lz4/lz4"
commit = "aa4647fad575d01a874aaaadcdbe8e6a40e072f5"
tag = "v1.11.1"

[platforms]
supported = ["linux"]
build-on = ["linux/gcc", "linux/clang"]

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "LZ4"
libraries = ["lz4"]
