# The otok recipe of otok (https://github.com/otok-dev/otok): otok itself for Linux, from the source archive of its
# release, with its own CMake project and the libraries of these recipes in place of vcpkg's: toml++ (compiled),
# nlohmann/json, inja, curl with Mbed TLS, libarchive with zlib, bzip2, liblzma, LZ4, Zstandard, libxml2, OpenSSL and
# libacl. A tool only: the program otok. The tests are not built.
[recipe]
api = 1
library = "otok"
name = "otok"
version = "0.6.9"
revision = 1
license = "GPL-3.0-only WITH AdditionRef-otok-output-exception"
license-files = ["LICENSE", "LICENSE-EXCEPTION"]
homepage = "https://otok-dev.github.io"
documentation = "https://github.com/otok-dev/otok"
description = "otok, the dependency manager that builds native libraries from source, built by otok."
keywords = ["package-manager", "build", "dependencies"]
cxx-standard = ">= 23"

[tool]
programs = ["otok"]

[source]
url = "https://github.com/otok-dev/otok/releases/download/v0.6.9/otok-0.6.9.tar.gz"
sha256 = "461b530fb012a35217d39ba977cc323b808c8141e6d95c091ecfb07e2da66091"

[platforms]
supported = ["linux"]
build-on = ["linux/gcc", "linux/clang"]

[deps.tomlplusplus]
version = ">= 3.4"
default-recipe = "apotocki/tomlplusplus"
requires-options = { compiled = true }

[deps.nlohmann-json]
version = ">= 3.11"
default-recipe = "apotocki/nlohmann-json"

[deps.inja]
version = ">= 3.4"
default-recipe = "apotocki/inja"

[deps.curl]
version = ">= 8.0"
default-recipe = "apotocki/curl"

[deps.libarchive]
version = ">= 3.7"
default-recipe = "apotocki/libarchive"
requires-options = { zlib = true, bzip2 = true, lzma = true, zstd = true }

# The libraries a static curl and libarchive need with the default options of their recipes (TLS of Mbed TLS, XML of
# libxml2, encryption of OpenSSL, ACLs of libacl), which otok links itself: their CMake files are not used
[deps.mbedtls]
version = ">= 4.0"
default-recipe = "apotocki/mbedtls"

[deps.libxml2]
version = ">= 2.9"
default-recipe = "apotocki/libxml2"

[deps.openssl]
version = ">= 3.0"
default-recipe = "apotocki/openssl"

[deps.zlib]
version = ">= 1.2"
default-recipe = "apotocki/zlib"

[deps.bzip2]
version = ">= 1.0"
default-recipe = "apotocki/bzip2"

[deps.lzma]
version = ">= 5.0"
default-recipe = "apotocki/lzma"

[deps.lz4]
version = ">= 1.7"
default-recipe = "apotocki/lz4"

[deps.zstd]
version = ">= 1.4"
default-recipe = "apotocki/zstd"

[deps.libacl]
version = ">= 2.3"
default-recipe = "apotocki/libacl"

[toolchains]
cmake = { version = ">= 3.25", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }
