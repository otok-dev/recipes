# The otok recipe of Pixman (https://github.com/otok-dev/otok): pixman-1 for Windows, from the release tag, with MSVC
# or with clang-cl across from Linux; static or dynamic. pixman_reset_static_data() frees the implementations it chose
# for the CPU, which MSVC's builds never free (Cairo's cairo_debug_reset_static_data() calls it).
[recipe]
api = 1
library = "pixman"
name = "pixman"
version = "0.46.4"
revision = 1
license = "MIT"
license-files = ["COPYING"]
homepage = "https://pixman.org"
description = "Pixman, the pixel-manipulation library of Cairo and X."
keywords = ["graphics", "pixels", "compositing"]
linkage = ["static", "dynamic"]

[source]
git = "https://gitlab.freedesktop.org/pixman/pixman.git"
commit = "9cc163c9da0fb4da430641715313d95a6ec466d9"
tag = "pixman-0.46.4"
patches = ["patches/0001-reset-static-data.patch"]

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[toolchains]
meson = { version = ">= 1.3", default-recipe = "apotocki/meson" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "Pixman"
libraries = ["pixman-1"]
