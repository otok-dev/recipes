# The otok recipe of Pixman (https://github.com/apotocki/otok): libpixman-1 for Linux, from the release tag; static or
# dynamic.
[recipe]
api = 1
library = "pixman"
name = "pixman"
version = "0.44.2"
revision = 1
license = "MIT"
license-files = ["COPYING"]
homepage = "https://pixman.org"
description = "Pixman, the pixel-manipulation library of Cairo and X."
keywords = ["graphics", "pixels", "compositing"]
linkage = ["static", "dynamic"]

[source]
git = "https://gitlab.freedesktop.org/pixman/pixman.git"
commit = "46655e15671e1ca62d699821d75a85d341d7229c"
tag = "pixman-0.44.2"
patches = ["patches/0001-reset-static-data.patch"]

[platforms]
supported = ["linux"]
build-on = ["linux/gcc", "linux/clang"]

[toolchains]
meson = { version = ">= 1.3", default-recipe = "apotocki/meson" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "Pixman"
libraries = ["pixman-1"]
