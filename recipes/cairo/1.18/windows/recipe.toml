# The otok recipe of Cairo (https://github.com/otok-dev/otok) for Windows: Cairo 1.18.6 from its release archive, or
# with d2d the branch d2d of the fork https://github.com/apotocki/cairo, which adds the Direct2D surface on Direct3D
# 10.1 and 11. With MSVC or with clang-cl across from Linux. Static or dynamic; Pixman, FreeType and libpng static
# unless the project chooses otherwise, zlib as the project builds it. cairo_debug_reset_static_data() frees the Win32
# device (issue #19) and pixman's implementations (with the pixman recipe of this repository), with or without d2d.
[recipe]
api = 1
library = "cairo"
name = "cairo"
version = "1.18.6"
revision = 1
license = "LGPL-2.1-only OR MPL-1.1"
license-files = ["COPYING", "COPYING-LGPL-2.1", "COPYING-MPL-1.1"]
homepage = "https://www.cairographics.org"
description = "Cairo, the 2D graphics library, for Windows: GDI, DirectWrite and, as an option, Direct2D."
keywords = ["graphics", "2d", "vector", "direct2d"]
linkage = ["static", "dynamic"]
# the C++ of the Windows SDK headers of Direct2D (d2d1_3.h), which take MSVC's standard library: C++14 at least
cxx-standard = ">= 14"

[source]
url = "https://cairographics.org/releases/cairo-1.18.6.tar.xz"
sha256 = "1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4"
# the branch legacy of apotocki/cairo, the fixes of the branch d2d that are not of Direct2D: the Win32 device freed
# (issue #19), pixman_reset_static_data() called, no WIC factory leaked per glyph; the resource d2d has them already
patches = ["patches/0001-win32-device-reset.patch", "patches/0002-pixman-reset-static-data.patch", "patches/0003-wic-factory-leak.patch"]

# the branch d2d of apotocki/cairo: the Direct2D surface (cairo_d2d_* of cairo-win32.h) on Cairo 1.18.6
[[resource]]
name = "d2d"
git = "https://github.com/apotocki/cairo"
commit = "94c276728073dc24c2eb6329f6f593b1168740f1"
when = { option = "d2d" }

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[options.d2d]
type = "bool"
default = false
doc = "The Direct2D surface on Direct3D 10.1 and 11 (CAIRO_HAS_D2D_SURFACE, cairo_d2d_* in cairo-win32.h), its CSS blend modes and GPU drop shadow: the branch d2d of apotocki/cairo."

[deps.pixman]
version = ">= 0.40"
default-recipe = "apotocki/pixman"
linkage = "static"

[deps.freetype]
version = ">= 2.10"
default-recipe = "apotocki/freetype"
linkage = "static"

[deps.libpng]
version = ">= 1.6"
default-recipe = "apotocki/libpng"
linkage = "static"

[deps.zlib]
version = ">= 1.2"
default-recipe = "apotocki/zlib"

[toolchains]
meson = { version = ">= 1.3", default-recipe = "apotocki/meson" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }
pkg-config = { version = ">= 1", default-recipe = "apotocki/pkgconf" }

[[product]]
name = "Cairo"
libraries = ["cairo"]
