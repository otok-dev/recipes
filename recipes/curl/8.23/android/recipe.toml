# The otok recipe of curl (https://github.com/apotocki/otok): libcurl for Android, from the release archive, with curl's
# CMake, Mbed TLS or OpenSSL (or no TLS) and the NDK's zlib; static or dynamic. Zstandard with the option `zstd`, Brotli with `brotli`, HTTP/2 with `http2`, the Public Suffix List with `psl`. SFTP and SCP with the option `ssh`.
# No HTTP/3, IDN or LDAP. Certificates are looked for in the system's directory, /system/etc/security/cacerts.
[recipe]
api = 1
library = "curl"
name = "curl"
version = "8.23.0"
revision = 1
license = "curl"
license-files = ["COPYING"]
homepage = "https://curl.se"
documentation = "https://curl.se/libcurl/"
description = "libcurl, the multiprotocol file transfer library."
keywords = ["http", "https", "ftp", "network", "transfer", "url"]
linkage = ["static", "dynamic"]

[source]
url = "https://curl.se/download/curl-8.23.0.tar.xz"
sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"

[platforms]
supported = ["android"]
build-on = ["*/ndk"]

[options.tls]
type = "enum"
values = ["mbedtls", "openssl", "none"]
default = "mbedtls"
doc = "The TLS library: Mbed TLS or OpenSSL (the consumer gives the certificates: CURLOPT_CAINFO, CURLOPT_CAPATH or CURLOPT_CAINFO_BLOB) or none (no HTTPS)."

[options.ssh]
type = "bool"
default = false
doc = "SFTP and SCP with libssh2, which uses OpenSSL (OpenSSL is then linked whatever `tls` is)."

[deps.openssl]
version = ">= 3.0"
default-recipe = "apotocki/openssl"
when = { option = "tls", is = "openssl" }

[deps.libssh2]
version = ">= 1.11"
default-recipe = "apotocki/libssh2"
when = { option = "ssh" }

[deps.mbedtls]
version = ">= 4.0"
default-recipe = "apotocki/mbedtls"
when = { option = "tls", is = "mbedtls" }

[options.zstd]
type = "bool"
default = false
additive = true
doc = "Content-Encoding: zstd, with Zstandard."

[deps.zstd]
version = ">= 1.4"
default-recipe = "apotocki/zstd"
when = { option = "zstd" }

[options.brotli]
type = "bool"
default = false
additive = true
doc = "Content-Encoding: br, with Brotli."

[deps.brotli]
version = ">= 1.0"
default-recipe = "apotocki/brotli"
when = { option = "brotli" }

[options.http2]
type = "bool"
default = false
additive = true
doc = "HTTP/2, with nghttp2."

[deps.nghttp2]
version = ">= 1.0"
default-recipe = "apotocki/nghttp2"
when = { option = "http2" }

[options.psl]
type = "bool"
default = false
additive = true
doc = "The Public Suffix List, with libpsl: cookies are refused for domains that are public suffixes (co.uk)."

[deps.libpsl]
version = ">= 0.20"
default-recipe = "apotocki/libpsl"
when = { option = "psl" }

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "CURL"
libraries = ["curl"]
link = { libraries = ["z"] }
