# The otok recipe of curl (https://github.com/apotocki/otok): libcurl for Linux, from the release archive, with curl's
# CMake and Mbed TLS (or no TLS) and zlib from their recipes; static or dynamic. Zstandard with the option `zstd`, Brotli with `brotli`, HTTP/2 with `http2`. No HTTP/3, libpsl,
# IDN, LDAP or libssh2. No CA bundle is built in or searched for: the program gives the certificates to libcurl.
[recipe]
api = 1
library = "curl"
name = "curl"
version = "8.23.0"
revision = 1
license = "curl"
license-files = ["COPYING"]
homepage = "https://curl.se"
documentation = "https://curl.se/libcurl/"
description = "libcurl, the multiprotocol file transfer library."
keywords = ["http", "https", "ftp", "network", "transfer", "url"]
linkage = ["static", "dynamic"]

[source]
url = "https://curl.se/download/curl-8.23.0.tar.xz"
sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"

[platforms]
supported = ["linux"]
build-on = ["linux/gcc", "linux/clang"]

[options.tls]
type = "enum"
values = ["mbedtls", "none"]
default = "mbedtls"
doc = "The TLS library: Mbed TLS (the consumer gives the certificates: CURLOPT_CAINFO, CURLOPT_CAPATH or CURLOPT_CAINFO_BLOB) or none (no HTTPS)."

[deps.mbedtls]
version = ">= 4.0"
default-recipe = "apotocki/mbedtls"
when = { option = "tls", is = "mbedtls" }

[deps.zlib]
version = ">= 1.2"
default-recipe = "apotocki/zlib"

[options.zstd]
type = "bool"
default = false
additive = true
doc = "Content-Encoding: zstd, with Zstandard."

[deps.zstd]
version = ">= 1.4"
default-recipe = "apotocki/zstd"
when = { option = "zstd" }

[options.brotli]
type = "bool"
default = false
additive = true
doc = "Content-Encoding: br, with Brotli."

[deps.brotli]
version = ">= 1.0"
default-recipe = "apotocki/brotli"
when = { option = "brotli" }

[options.http2]
type = "bool"
default = false
additive = true
doc = "HTTP/2, with nghttp2."

[deps.nghttp2]
version = ">= 1.0"
default-recipe = "apotocki/nghttp2"
when = { option = "http2" }

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "CURL"
libraries = ["curl"]
