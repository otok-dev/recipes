# The otok recipe of curl (https://github.com/apotocki/otok): libcurl for every Apple platform, from the release archive, with
# curl's CMake. TLS by the option `tls`: OpenSSL (the default; certificates are verified by the system's Security framework),
# Mbed TLS (the certificates are the consumer's to give) or none; SFTP and SCP with libssh2 (`ssh`, which needs OpenSSL).
# Zstandard with the option `zstd`, Brotli with `brotli`, HTTP/2 with `http2`, the Public Suffix List with `psl`. No HTTP/3, IDN or LDAP: only the libraries of the system and of the recipes below.
[recipe]
api = 1
library = "curl"
name = "curl"
version = "8.23.0"
revision = 1
license = "curl"
license-files = ["COPYING"]
homepage = "https://curl.se"
documentation = "https://curl.se/libcurl/"
description = "libcurl, the multiprotocol file transfer library."
keywords = ["http", "https", "ftp", "network", "transfer", "url"]
linkage = ["static", "dynamic"]

[source]
url = "https://curl.se/download/curl-8.23.0.tar.xz"
sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"

[platforms]
supported = ["ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim"]
build-on = ["macos/xcode"]

[options.tls]
type = "enum"
values = ["openssl", "mbedtls", "none"]
default = "openssl"
doc = "The TLS library: OpenSSL, whose certificates are verified by the system's Security framework, Mbed TLS (the consumer sets the certificates, CURLOPT_CAINFO_BLOB), or none (no HTTPS)."

[options.ssh]
type = "bool"
default = true
doc = "SFTP and SCP with libssh2, which uses OpenSSL (OpenSSL is then linked whatever `tls` is)."

[deps.openssl]
version = ">= 3.0"
default-recipe = "apotocki/openssl"
when = { option = "tls", is = "openssl" }

[deps.mbedtls]
version = ">= 4.0"
default-recipe = "apotocki/mbedtls"
when = { option = "tls", is = "mbedtls" }

[deps.libssh2]
version = ">= 1.11"
default-recipe = "apotocki/libssh2"
when = { option = "ssh" }

[options.zstd]
type = "bool"
default = false
additive = true
doc = "Content-Encoding: zstd, with Zstandard."

[deps.zstd]
version = ">= 1.4"
default-recipe = "apotocki/zstd"
when = { option = "zstd" }

[options.brotli]
type = "bool"
default = false
additive = true
doc = "Content-Encoding: br, with Brotli."

[deps.brotli]
version = ">= 1.0"
default-recipe = "apotocki/brotli"
when = { option = "brotli" }

[options.http2]
type = "bool"
default = false
additive = true
doc = "HTTP/2, with nghttp2."

[deps.nghttp2]
version = ">= 1.0"
default-recipe = "apotocki/nghttp2"
when = { option = "http2" }

[options.psl]
type = "bool"
default = false
additive = true
doc = "The Public Suffix List, with libpsl: cookies are refused for domains that are public suffixes (co.uk)."

[deps.libpsl]
version = ">= 0.20"
default-recipe = "apotocki/libpsl"
when = { option = "psl" }

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "CURL"
libraries = ["curl"]
link = { libraries = ["z"] }
apple = { frameworks = ["CoreFoundation", "CoreServices", "SystemConfiguration", "Security"], privacy-manifest = "PrivacyInfo.xcprivacy" }
