# The otok recipe of Boost (docs/PLAN.md decision 36): the headers as one product, the compiled
# libraries the project selects as products of their own (recipe-toml.md 11.1).
[recipe]
api = 1
library = "boost"
name = "boost"
version = "1.92.0"
revision = 2
variant = "windows-msvc"
license = "BSL-1.0"
license-files = ["LICENSE_1_0.txt"]
homepage = "https://www.boost.org"
documentation = "https://www.boost.org/doc/libs/1_92_0/"
description = "Boost C++ libraries: the headers, and the compiled libraries a project selects."
keywords = ["boost", "cpp"]
linkage = ["static", "dynamic"]
cxx-standard = ">= 11"

[source]
url = "https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2"
mirrors = ["https://sourceforge.net/projects/boost/files/boost/1.92.0/boost_1_92_0.tar.bz2"]
sha256 = "5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c"
# the resource scripts of MSVC with only the include paths of the build directory; codecvt_null in serialization alone,
# as Boost's CMake builds it
patches = ["patches/0003-msvc-rc-includes.patch", "patches/0004-serialization-codecvt-null-once.patch"]

[platforms]
supported = ["windows"]
build-on = ["windows/msvc"]

[options.libraries]
type = "list"
values = ["atomic", "charconv", "chrono", "cobalt", "container", "context", "contract", "coroutine", "date_time", "exception", "fiber", "filesystem", "graph", "iostreams", "json", "locale", "log", "math", "nowide", "process", "program_options", "random", "regex", "serialization", "stacktrace", "test", "thread", "timer", "type_erasure", "url", "wave"]
default = []
additive = true
doc = "The compiled libraries to build (b2 --with-<library>); each becomes a product. Without any, Boost is its headers."

[options.icu]
type = "bool"
default = false
doc = "ICU (the icu4c recipe) as the backend of Boost.Locale and for the Unicode support of Boost.Regex (boost/regex/icu.hpp). The products of Boost then hold ICU's libraries, which a static link takes only as far as it uses them."

[deps.icu4c]
version = ">= 70"
default-recipe = "apotocki/icu4c"
when = { option = "icu" }

[[product]]
name = "Boost"
libraries = []
link = { runtime = "c++" }

