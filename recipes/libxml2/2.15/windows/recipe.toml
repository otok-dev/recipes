# The otok recipe of libxml2 (https://github.com/apotocki/otok): libxml2 for Windows, from the release archive, with libxml2's CMake, the
# library only (no xmllint, tests or Python); static (consumers are built with LIBXML_STATIC, which the product defines).
[recipe]
api = 1
library = "libxml2"
name = "libxml2"
version = "2.15.4"
revision = 1
license = "MIT"
license-files = ["Copyright"]
homepage = "https://gitlab.gnome.org/GNOME/libxml2"
documentation = "https://gitlab.gnome.org/GNOME/libxml2/-/wikis/home"
description = "libxml2, the XML C parser and toolkit of GNOME."
keywords = ["xml", "html", "xpath", "parser"]
linkage = ["static"]

[source]
url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"

[options.zlib]
type = "bool"
default = false
additive = true
doc = "Reading and writing gzip-compressed documents, with zlib."

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[deps.zlib]
version = ">= 1.2"
default-recipe = "apotocki/zlib"
when = { option = "zlib" }

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "LibXml2"
libraries = ["xml2"]
defines = ["LIBXML_STATIC"]
link = { libraries = ["ws2_32", "bcrypt"] }
