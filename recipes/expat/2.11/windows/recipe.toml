# The otok recipe of Expat (https://github.com/otok-dev/otok): libexpat for Windows, from the release archive, with Expat's CMake, the
# library only (no xmlwf, examples or tests); static (consumers are built with XML_STATIC, which the product defines).
[recipe]
api = 1
library = "expat"
name = "expat"
version = "2.11.0"
revision = 1
license = "MIT"
license-files = ["COPYING"]
homepage = "https://libexpat.github.io"
documentation = "https://libexpat.github.io/doc/"
description = "Expat, a stream-oriented XML parser library written in C."
keywords = ["xml", "parser"]
linkage = ["static"]

[source]
url = "https://github.com/libexpat/libexpat/releases/download/R_2_11_0/expat-2.11.0.tar.xz"
sha256 = "61e7614b602201c28a189dafee78f5bceaee192bbde46a930752ff09cf5542fa"

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "Expat"
libraries = ["expat"]
defines = ["XML_STATIC"]

# the CMake names of the library (recipe-toml.md 11.4)
[cmake.EXPAT]
targets = { "EXPAT::EXPAT" = "Expat", "expat::expat" = "Expat" }
