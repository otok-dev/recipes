# The otok recipe of CMake (https://github.com/otok-dev/otok): the cmake program for the builds of other recipes, which
# name it as their toolchain (`cmake = { default-recipe = "apotocki/cmake" }`), on macOS: Kitware's universal release
# binaries; the source archive carries the license.
[recipe]
api = 1
library = "cmake"
name = "cmake"
version = "4.5.1"
revision = 1
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
homepage = "https://cmake.org"
description = "CMake, the cross-platform build system generator, as Kitware releases it."
keywords = ["build", "tool"]

[tool]
programs = ["cmake", "ctest", "cpack"]

[source]
url = "https://github.com/Kitware/CMake/releases/download/v4.5.1/cmake-4.5.1.tar.gz"
sha256 = "a79bf33cbe05686fdf79c2bbbcfe5e8e62ad16d3d540fa737cbedfeed41fb69e"

[[resource]]
name = "macos"
url = "https://github.com/Kitware/CMake/releases/download/v4.5.1/cmake-4.5.1-macos-universal.tar.gz"
sha256 = "e1fb288543e4eb2a410e385ecebc64323bda51f0205782f2b094ccd5d572ca2d"
when = { host = ["macos-arm64", "macos-x86_64"] }

[platforms]
supported = ["macosx"]
build-on = ["macos/xcode"]
