# The otok recipe of CMake (https://github.com/otok-dev/otok): the cmake program for the builds of other recipes, which
# name it as their toolchain (`cmake = { default-recipe = "apotocki/cmake" }`), on Windows: Kitware's release binaries
# of the build machine (a resource per architecture, fetched on that machine only); the source archive carries the
# license.
[recipe]
api = 1
library = "cmake"
name = "cmake"
version = "4.5.1"
revision = 1
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
homepage = "https://cmake.org"
description = "CMake, the cross-platform build system generator, as Kitware releases it."
keywords = ["build", "tool"]

[tool]
programs = ["cmake", "ctest", "cpack"]

[source]
url = "https://github.com/Kitware/CMake/releases/download/v4.5.1/cmake-4.5.1.tar.gz"
sha256 = "a79bf33cbe05686fdf79c2bbbcfe5e8e62ad16d3d540fa737cbedfeed41fb69e"

[[resource]]
name = "windows_x86_64"
url = "https://github.com/Kitware/CMake/releases/download/v4.5.1/cmake-4.5.1-windows-x86_64.zip"
sha256 = "bfe6eadb245dc8213e0d3feea316b520cb2aae92f5667ffd76059ba6b05c430c"
when = { host = ["windows-x86_64"] }

[[resource]]
name = "windows_arm64"
url = "https://github.com/Kitware/CMake/releases/download/v4.5.1/cmake-4.5.1-windows-arm64.zip"
sha256 = "6782f11382941bb85c406eb3bd32a702222d8956535ae9cec5ee77395be2cc78"
when = { host = ["windows-arm64"] }

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "windows/clang-cl"]
