# The otok recipe of GNU M4 (https://github.com/apotocki/otok): the m4 macro processor for the builds of other recipes,
# which name it as their toolchain (`m4 = { default-recipe = "apotocki/m4" }`), flex and Bison among them, which run it
# and carry it beside their programs; on Linux: built from the release archive with its configure and make.
[recipe]
api = 1
library = "m4"
name = "m4"
version = "1.4.21"
revision = 1
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
homepage = "https://www.gnu.org/software/m4/"
documentation = "https://www.gnu.org/software/m4/manual/"
description = "GNU M4, the macro processor, built from source."
keywords = ["macro", "m4", "tool"]

[tool]
programs = ["m4"]

[source]
url = "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz"
sha256 = "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"
mirrors = ["https://ftpmirror.gnu.org/gnu/m4/m4-1.4.21.tar.xz"]

[platforms]
supported = ["linux"]
build-on = ["linux/gcc", "linux/clang"]

[toolchains]
make = { version = ">= 3.81", default-recipe = "apotocki/make" }
