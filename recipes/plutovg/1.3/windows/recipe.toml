# The otok recipe of PlutoVG (https://github.com/apotocki/otok): plutovg for Windows, from the release tag, with MSVC
# or with clang-cl across from Linux; static or dynamic.
[recipe]
api = 1
library = "plutovg"
name = "plutovg"
version = "1.3.3"
revision = 1
license = "MIT"
license-files = ["LICENSE"]
homepage = "https://github.com/sammycage/plutovg"
description = "PlutoVG, a tiny 2D vector graphics library in C."
keywords = ["graphics", "vector", "2d"]
linkage = ["static", "dynamic"]

[source]
git = "https://github.com/sammycage/plutovg"
commit = "bbd91f0d06a71491691b36330f29dffa4af87ccf"
tag = "v1.3.3"

[platforms]
supported = ["windows"]
build-on = ["windows/msvc", "linux/clang-cl"]

[toolchains]
cmake = { version = ">= 3.20", default-recipe = "apotocki/cmake" }
ninja = { version = ">= 1.10", default-recipe = "apotocki/ninja" }

[[product]]
name = "PlutoVG"
libraries = ["plutovg"]
