# The otok recipe of Cairo (https://github.com/apotocki/otok) for the native target on Windows: Cairo 1.18.4 from its
# release archive, or with d2d the branch d2d of the fork https://github.com/apotocki/cairo, which adds the Direct2D
# surface on Direct3D 10.1 and 11. Static or dynamic; Pixman, FreeType and libpng static unless the project chooses
# otherwise, zlib as the project builds it.
[recipe]
api = 1
library = "cairo"
name = "cairo"
version = "1.18.4"
revision = 1
license = "LGPL-2.1-only OR MPL-1.1"
license-files = ["COPYING", "COPYING-LGPL-2.1", "COPYING-MPL-1.1"]
homepage = "https://www.cairographics.org"
description = "Cairo, the 2D graphics library, for Windows: GDI, DirectWrite and, as an option, Direct2D."
keywords = ["graphics", "2d", "vector", "direct2d"]
linkage = ["static", "dynamic"]

[source]
url = "https://cairographics.org/releases/cairo-1.18.4.tar.xz"
sha256 = "445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb"

# the branch d2d of apotocki/cairo: the Direct2D surface (cairo_d2d_* of cairo-win32.h) on Cairo 1.18.4
[[resource]]
name = "d2d"
git = "https://github.com/apotocki/cairo"
commit = "e934468cdf8b488a72639ab7e2accabe5cd3e4b1"
when = { option = "d2d" }

[platforms]
supported = ["native"]

[options.d2d]
type = "bool"
default = false
doc = "The Direct2D surface on Direct3D 10.1 and 11 (CAIRO_HAS_D2D_SURFACE, cairo_d2d_* in cairo-win32.h), its CSS blend modes and GPU drop shadow: the branch d2d of apotocki/cairo."

[dependencies.pixman]
version = ">= 0.40"
default-recipe = "apotocki/pixman"
linkage = "static"

[dependencies.freetype]
version = ">= 2.10"
default-recipe = "apotocki/freetype"
linkage = "static"

[dependencies.libpng]
version = ">= 1.6"
default-recipe = "apotocki/libpng"
linkage = "static"

[dependencies.zlib]
version = ">= 1.2"
default-recipe = "apotocki/zlib"

[toolchains]
meson = ">= 1.3"
ninja = ">= 1.10"
pkg-config = ">= 1"

[[product]]
name = "Cairo"
libraries = ["cairo"]
