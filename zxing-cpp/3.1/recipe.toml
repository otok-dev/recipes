# The otok recipe of zxing-cpp (https://github.com/apotocki/otok): the barcode reader library, with `writers`
# also the writer of its new backend, the bundled libzint (the submodule zint/), for Android, Apple and the native target;
# on Apple with the Swift API of this recipe (wrappers/ZXingSwift: BarcodeReader, BarcodeWriter) over zxing-cpp's C API.
# With `jni`, on Android, the library is the JNI library of zxing-cpp's Android wrapper instead, for an app that uses
# zxingcpp.BarcodeReader without the wrapper's AAR, and with `writers` zxingcpp.BarcodeWriter of this recipe (android/) too.
[recipe]
api = 1
library = "zxing-cpp"
name = "zxing-cpp"
version = "3.1.1"
revision = 3
# the reader carries libzueci (core/src/libzueci), the writer libzint (zint/backend), both BSD-3-Clause; the source has
# neither text: zint/LICENSE only says which part of zint is BSD, the text is in the headers of its files. The code of
# android/ and wrappers/ is this recipe's own, CC0-1.0.
license = "Apache-2.0 AND BSD-3-Clause AND CC0-1.0"
license-files = ["LICENSE", { recipe = "LICENSE-libzueci" }, "zint/LICENSE", { recipe = "LICENSE-zint" }]
homepage = "https://github.com/zxing-cpp/zxing-cpp"
description = "zxing-cpp, a barcode reader and writer for linear and matrix formats: QR Code, Micro QR, rMQR, Aztec, DataMatrix, PDF417, MaxiCode, EAN/UPC, Code 39/93/128, ITF, Codabar, DataBar and others."
keywords = ["barcode", "qrcode", "scanner", "zxing"]
linkage = ["static", "dynamic"]
cxx-standard = ">= 20"

[source]
git = "https://github.com/zxing-cpp/zxing-cpp"
commit = "287c85df6f961c8efbfb5ffd736cd9457b8b890e"
tag = "v3.1.1"
# zint/, the writer's backend
submodules = true

[platforms]
supported = ["android", "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim", "native", "windows"]

[options.jni]
type = "bool"
default = false
doc = "Android: libzxingcpp_android.so, the JNI library of zxing-cpp's Android wrapper (wrappers/android), with the reader inside, as the library ZXing of the product ZXing, without headers; data/ of the output has the wrapper's BarcodeReader.kt, the class of zxingcpp.BarcodeReader that loads it, for the app's sources (with the ProGuard rule -keep class zxingcpp.** { *; }: the library makes the class's results through JNI). With writers, also the recipe's writer (android/ZXingCppWriter.cpp) and BarcodeWriter.kt, zxingcpp.BarcodeWriter. Needs linkage = \"dynamic\"."

[options.writers]
type = "bool"
default = false
doc = "The writer of the new backend (ZXING_WRITERS = NEW: CreateBarcode.h, WriteBarcode.h), built from the bundled libzint into the ZXing library; with jni into libzxingcpp_android.so, with zxingcpp.BarcodeWriter."

[toolchains]
cmake = ">= 3.16"
ninja = ">= 1.10"

[[product]]
name = "ZXing"
libraries = ["ZXing"]
link = { libraries = ["c++"] }
# Swift sees the C API only (module_map of build.lua): the other headers are C++
apple = { module = "CZXing", wrappers = ["ZXingSwift"], privacy-manifest = "PrivacyInfo.xcprivacy" }
